<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia Institucional con Carnet QR</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Módulo de Asistencia Institucional</h1>
  </header>
  
  <main>
    <!-- LECTOR / ESCÁNER -->
    <section class="card" id="lector">
      <h2>Registro de Ingreso</h2>
      <input type="text" id="inputLector" placeholder="Pase el carnet por el lector..." autofocus autocomplete="off">
      <div id="mensaje" class="mensaje"></div>
    </section>

    <!-- GESTIÓN DE ESTUDIANTES -->
    <section class="card">
      <h2>Gestión de Estudiantes</h2>
      <div class="form-fila">
        <input type="text" id="codigo" placeholder="Código (ej. EST-0001)">
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="text" id="grado" placeholder="Grado/Curso">
        <button id="btnAgregar">Agregar Estudiante</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Grado</th>
            <th>Código QR</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaEstudiantes"></tbody>
      </table>
    </section>

    <!-- HISTORIAL DE ASISTENCIA -->
    <section class="card">
      <h2>Historial de Asistencia</h2>
      <div class="filtro-contenedor">
        <label for="filtroFecha"><strong>Filtrar por Fecha:</strong> </label>
        <input type="date" id="filtroFecha">
      </div>
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Hora</th>
          </tr>
        </thead>
        <tbody id="tablaAsistencia"></tbody>
      </table>
    </section>
  </main>

  <!-- Librería para generación de QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
